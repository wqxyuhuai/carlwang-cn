name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx wrangler@latest deploy --message "${{ github.sha }} ${{ github.event.head_commit.message }}"
          VERSION_ID="$(npx wrangler@latest versions list --json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const versions = JSON.parse(data); const latest = versions[0] || {}; const id = latest.id || latest.version_id || latest.versionId; if (!id) { console.error('Could not find latest Cloudflare Worker version ID'); process.exit(1); } console.log(id); })")"
          npx wrangler@latest versions deploy "${VERSION_ID}@100%" --message "${{ github.sha }} ${{ github.event.head_commit.message }}" --yes

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
